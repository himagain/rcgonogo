<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Flying • Go/No-Go</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .go-green { background-color: #10b981; color: black; }
        .go-amber { background-color: #eab308; color: black; }
        .go-red   { background-color: #ef4444; color: white; }
        .map-container { height: 280px; border-radius: 16px; overflow: hidden; }
        .sticky-left { position: sticky; left: 0; background: #1f2937; z-index: 10; }
    </style>
</head>
<body class="bg-gray-950 text-white">
    <div class="max-w-7xl mx-auto p-4">
        <h1 class="text-4xl font-bold text-center mb-1">RC Flying</h1>
        <p class="text-center text-emerald-400 mb-6" id="location">Ashbourne, Derbyshire</p>

        <div class="flex gap-2 mb-6">
            <input id="searchBox" type="text" placeholder="Search location (e.g. Derby, UK)" 
                   class="flex-1 bg-gray-900 border border-gray-700 rounded-2xl px-5 py-3">
            <button onclick="searchLocation()" 
                    class="bg-emerald-600 hover:bg-emerald-700 px-6 rounded-2xl">Search</button>
        </div>

        <!-- Sliders -->
        <div class="bg-gray-900 rounded-3xl p-6 mb-8">
            <div class="grid grid-cols-1 gap-6">
                <div>
                    <label class="block text-sm mb-2">Max Wind <span id="windVal" class="font-bold">10</span> mph</label>
                    <input type="range" id="windSlider" min="5" max="25" value="10" class="w-full accent-emerald-500">
                </div>
                <div>
                    <label class="block text-sm mb-2">Min Temp <span id="tempVal" class="font-bold">10</span> °C</label>
                    <input type="range" id="tempSlider" min="0" max="20" value="10" class="w-full accent-emerald-500">
                </div>
                <div>
                    <label class="block text-sm mb-2">Max Rain <span id="rainVal" class="font-bold">20</span> %</label>
                    <input type="range" id="rainSlider" min="0" max="100" value="20" class="w-full accent-emerald-500">
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="mb-8">
            <div id="map" class="map-container shadow-2xl"></div>
            <p class="text-xs text-center text-gray-400 mt-2">Tap anywhere on the map → weather will update</p>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-3xl border border-gray-700 bg-gray-900">
            <table class="w-full" id="flyingTable">
                <thead>
                    <tr class="bg-gray-800">
                        <th class="sticky-left pl-4">Date</th>
                        <th>06-09</th>
                        <th>09-12</th>
                        <th>12-15</th>
                        <th>15-18</th>
                        <th>18-21</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentLat = 53.018;
        let currentLon = -1.728;
        let forecastData = [];
        let map, marker;

        async function fetchWeather(lat, lon, placeName = "Selected Location") {
            document.getElementById("location").innerHTML = `🔄 Fetching weather for ${placeName}...`;
            
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation_probability&timezone=Europe/London`;
                const res = await fetch(url);
                const data = await res.json();

                forecastData = processData(data);
                renderTable();
                
                document.getElementById("location").innerHTML = `🌍 ${placeName} <span class="text-xs text-green-400">(Updated)</span>`;
            } catch (e) {
                console.error(e);
                alert("Weather API failed. Please check internet connection.");
            }
        }

        function processData(data) {
            const days = [];
            const now = new Date();
            for (let i = 0; i < 8; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() + i);
                const dateStr = d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
                
                const slots = [];
                for (let s = 0; s < 5; s++) {
                    const idx = i*24 + 6 + s*3;
                    slots.push({
                        temp: Math.round(data.hourly.temperature_2m[idx] || 12),
                        wind: Math.round(data.hourly.wind_speed_10m[idx] || 8),
                        dir: getWindDir(data.hourly.wind_direction_10m[idx] || 0),
                        rain: Math.round(data.hourly.precipitation_probability[idx] || 20)
                    });
                }
                days.push({date: dateStr, slots});
            }
            return days;
        }

        function getWindDir(deg) {
            const dirs = ["N","NE","E","SE","S","SW","W","NW"];
            return dirs[Math.floor((deg + 22.5) / 45) % 8];
        }

        function getStatus(temp, wind, rain) {
            const maxW = +document.getElementById("windSlider").value;
            const minT = +document.getElementById("tempSlider").value;
            const maxR = +document.getElementById("rainSlider").value;

            if (wind > maxW) return {emoji:"🔴", score:2, cls:"go-red"};
            if (temp < minT || rain > maxR) return {emoji:"🟡", score:5, cls:"go-amber"};
            return {emoji:"🟢", score:9, cls:"go-green"};
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            forecastData.forEach(day => {
                let html = `<tr class="border-b border-gray-700"><td class="sticky-left font-medium pl-4 py-4">${day.date}</td>`;
                day.slots.forEach(slot => {
                    const st = getStatus(slot.temp, slot.wind, slot.rain);
                    html += `<td class="${st.cls} py-3">
                        <div>${slot.temp}°C • ${slot.wind} mph ${slot.dir}</div>
                        <div class="text-xs opacity-75">${slot.rain}% rain</div>
                        <div class="text-3xl my-1">${st.emoji}</div>
                        <div class="text-xs">${st.score}/10</div>
                    </td>`;
                });
                html += `</tr>`;
                tbody.innerHTML += html;
            });
        }

        function updateSliders() {
            document.getElementById("windVal").textContent = document.getElementById("windSlider").value;
            document.getElementById("tempVal").textContent = document.getElementById("tempSlider").value;
            document.getElementById("rainVal").textContent = document.getElementById("rainSlider").value;
            renderTable();
        }

        function searchLocation() {
            alert("Tap on the map to change location and update weather.\n\nFull search coming soon.");
        }

        window.onload = () => {
            // Slider listeners
            ["windSlider","tempSlider","rainSlider"].forEach(id => {
                document.getElementById(id).addEventListener("input", updateSliders);
            });

            // Map
            map = L.map('map').setView([currentLat, currentLon], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            marker = L.marker([currentLat, currentLon]).addTo(map)
                .bindPopup("Tap anywhere to update weather").openPopup();

            // Map click handler
            map.on('click', function(e) {
                currentLat = e.latlng.lat;
                currentLon = e.latlng.lng;
                marker.setLatLng(e.latlng);
                fetchWeather(currentLat, currentLon, "Selected Location");
            });

            // Initial load
            fetchWeather(currentLat, currentLon, "Ashbourne, Derbyshire");
        };
    </script>
</body>
</html>
