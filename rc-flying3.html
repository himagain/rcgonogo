<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Flying • Go/No-Go</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .go-green { background-color: #22c55e; color: black; }
        .go-amber { background-color: #eab308; color: black; }
        .go-red   { background-color: #ef4444; color: white; }
        .map-container { height: 200px; border-radius: 16px; overflow: hidden; }
        .sticky-left { position: sticky; left: 0; background: #1f2937; z-index: 10; }
        .blob { 
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 34px; height: 34px; border-radius: 9999px;
            font-size: 0.85rem; font-weight: 700;
        }
        .hour-row { transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-950 text-white">
    <div class="max-w-7xl mx-auto p-3">
        <h1 class="text-3xl font-bold text-center mb-1">RC Flying</h1>
        <p class="text-center text-emerald-400 mb-4" id="location">Ashbourne, Derbyshire</p>

        <!-- Sliders -->
        <div class="bg-gray-900 rounded-3xl p-4 mb-5">
            <div class="grid grid-cols-3 gap-4 text-xs">
                <div>
                    <label>Max Wind</label>
                    <input type="range" id="windSlider" min="5" max="25" value="10" class="w-full accent-emerald-500">
                    <span id="windVal" class="font-bold">10</span> mph
                </div>
                <div>
                    <label>Min Temp</label>
                    <input type="range" id="tempSlider" min="0" max="20" value="10" class="w-full accent-emerald-500">
                    <span id="tempVal" class="font-bold">10</span>°C
                </div>
                <div>
                    <label>Max Rain</label>
                    <input type="range" id="rainSlider" min="0" max="100" value="20" class="w-full accent-emerald-500">
                    <span id="rainVal" class="font-bold">20</span>%
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="mb-5">
            <div id="map" class="map-container shadow-2xl"></div>
            <p class="text-xs text-center text-gray-400 mt-2">Tap map to change location</p>
        </div>

        <!-- Main Table -->
        <div class="overflow-x-auto rounded-3xl border border-gray-700 bg-gray-900">
            <table class="w-full" id="flyingTable">
                <thead>
                    <tr class="bg-gray-800 text-[10px]">
                        <th class="sticky-left pl-3 py-2">Date</th>
                        <th>09-12</th>
                        <th>12-15</th>
                        <th>15-18</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-xs"></tbody>
            </table>
        </div>
    </div>

    <!-- Hourly Modal -->
    <div id="hourlyModal" class="modal flex items-end hidden">
        <div class="bg-gray-900 w-full rounded-t-3xl max-h-[85vh] overflow-auto">
            <div class="sticky top-0 bg-gray-900 p-4 border-b border-gray-700 flex justify-between">
                <h2 id="modalDate" class="text-lg font-bold"></h2>
                <button onclick="closeModal()" class="text-3xl">×</button>
            </div>
            <div id="hourlyContent" class="p-3 space-y-2"></div>
        </div>
    </div>

    <script>
        let currentLat = 53.018;
        let currentLon = -1.728;
        let forecastData = [];
        let fullHourlyData = {};
        let map, marker;

        const compass = ["N","NE","E","SE","S","SW","W","NW"];

        function getWindArrow(deg) {
            return compass[Math.floor((deg + 22.5) / 45) % 8];
        }

        function getWindColor(wind) {
            if (wind <= 8) return "bg-green-600 text-white";
            if (wind <= 12) return "bg-amber-500 text-black";
            return "bg-red-600 text-white";
        }

        function getWeatherIcon(rain) {
            if (rain >= 60) return "🌧️";
            if (rain >= 30) return "🌦️";
            return "⛅";
        }

        async function fetchWeather(lat, lon, placeName = "Selected Location") {
            document.getElementById("location").innerHTML = `🔄 Loading live data...`;
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,precipitation_probability,cloud_cover&timezone=Europe/London`;
                const res = await fetch(url);
                const data = await res.json();

                forecastData = processDailyData(data);
                fullHourlyData = data.hourly;
                renderTable();
                document.getElementById("location").innerHTML = `🌍 ${placeName}`;
            } catch (e) {
                console.error(e);
                alert("Weather service unavailable.");
            }
        }

        function processDailyData(data) {
            const days = [];
            const now = new Date();
            for (let i = 0; i < 8; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() + i);
                const dateStr = d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
                days.push({date: dateStr, dayIndex: i});
            }
            return days;
        }

        function getStatus(temp, wind, rain) {
            const maxW = +document.getElementById("windSlider").value;
            const minT = +document.getElementById("tempSlider").value;
            const maxR = +document.getElementById("rainSlider").value;

            if (wind > maxW) return {emoji:"🔴", score:2, cls:"go-red"};
            if (temp < minT || rain > maxR) return {emoji:"🟡", score:5, cls:"go-amber"};
            return {emoji:"🟢", score:9, cls:"go-green"};
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            forecastData.forEach(day => {
                let html = `<tr class="border-b border-gray-700 cursor-pointer hover:bg-gray-800" onclick="showHourly(${day.dayIndex}, '${day.date}')">
                    <td class="sticky-left font-medium pl-3 py-3">${day.date}</td>`;
